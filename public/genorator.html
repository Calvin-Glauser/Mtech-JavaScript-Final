<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIF Meme Generator</title>

    <link rel="stylesheet" href="./css/Genorator.css" />
    <style></style>
    <script>
      if (new URLSearchParams(location.search).has("lobby"))
        document.documentElement.classList.add("game-mode");
    </script>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=download"
    />
  </head>
  <body>
    <a href="index.html"></a>

    <input id="searchInput" placeholder="Search GIPHY" />
    <button id="searchButton">Search GIFs</button>

    <div id="results"></div>

    <div id="memePreview">
      <div id="captionBar"></div>
      <img id="gifPreview" alt="Selected GIF" />
    </div>

    <input id="topText" placeholder="Enter caption" />

    <button id="applyTextBtn">Apply Text to GIF</button>

    <button id="downloadBtn" disabled>
      <span id="icobtn" class="material-symbols-outlined"> download </span>
    </button>

    <p id="status" role="status"></p>

    <main id="gameView" class="hidden">
      <h1 id="gameHeading">GIF game</h1>
      <p id="gameRole"></p>
      <p id="gameMessage" role="status"></p>
      <p id="gameScore"></p>
      <p id="lastRound"></p>
      <section id="gameGallery" class="hidden" aria-labelledby="gameGalleryHeading">
        <h2 id="gameGalleryHeading">Game GIFs</h2>
        <div id="gameGalleryItems" class="game-gallery-items"></div>
      </section>
      <div id="gameCandidates"></div>
      <button id="rematchButton" class="hidden">Play again</button>
      <button id="gameLeaveButton" class="hidden">Return to main menu</button>
      <p id="gameError" role="alert"></p>
    </main>

    <script src="./Js/gif.js"></script>
    <script src="./Js/gif.worker.js"></script>
    <script type="module" src="./Js/Genorator.js"></script>
    <script type="module" src="./Js/Game.js"></script>
  </body>
</html>
